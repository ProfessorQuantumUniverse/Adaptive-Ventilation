name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON: "3.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff mypy
      - name: ruff check
        run: ruff check custom_components scripts tests
      - name: ruff format --check
        run: ruff format --check custom_components scripts tests
      - name: mypy (the engine is strict)
        # --follow-imports=silent keeps mypy from reporting on Home Assistant
        # itself, which it reaches through the parent package.
        run: mypy --strict --follow-imports=silent custom_components/adaptive_ventilation/engine

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pyyaml
          python -m pip install pytest-homeassistant-custom-component
      - name: Install the frontend package
        # The integration registers a sidebar panel, so it depends on the
        # frontend component, which needs hass_frontend at runtime. The test
        # plugin does not pull in component requirements, so install exactly
        # the version this Home Assistant pins.
        run: |
          python -m pip install "$(python -c '
          import json, os
          import homeassistant.components.frontend as f
          manifest = os.path.join(os.path.dirname(f.__file__), "manifest.json")
          print(json.load(open(manifest))["requirements"][0])
          ')"
      - name: Run the full suite
        # The tests under tests/hass/ need the Home Assistant plugin, which
        # only works on POSIX. They are skipped on Windows and run here.
        run: pytest tests --cov=custom_components/adaptive_ventilation --cov-report=term-missing
      - name: Replay the scenarios
        run: python scripts/replay.py --scenarios

  engine-only:
    name: Engine without Home Assistant
    runs-on: ubuntu-latest
    # The engine may only ever import plain Python. The test files listed here
    # are run against an interpreter with no homeassistant package installed,
    # so they have to keep that promise too - a test that reaches into
    # models.py belongs in tests/test_ha_*.py instead.
    env:
      ENGINE_TESTS: >-
        tests/test_engine_scenarios.py
        tests/test_engine_psychrometrics.py
        tests/test_engine_thermal.py
        tests/test_engine_solar.py
        tests/test_engine_properties.py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install the bare minimum
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Prove the engine has no Home Assistant import
        # If anything under engine/ - or in the standalone test files, or in
        # what they share through tests/ - ever reaches for homeassistant, this
        # fails: the package is not installed in this job at all.
        run: |
          python - <<'PY'
          import ast, os, pathlib, sys
          paths = list(
              pathlib.Path("custom_components/adaptive_ventilation/engine").rglob("*.py")
          )
          paths += [pathlib.Path(name) for name in os.environ["ENGINE_TESTS"].split()]
          paths += [pathlib.Path("tests/conftest.py"), pathlib.Path("tests/scenario.py")]
          bad = []
          for path in paths:
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [node.module or ""]
                  else:
                      continue
                  for name in names:
                      root = name.split(".")[0]
                      if root == "homeassistant" or name.startswith("adaptive_ventilation.models"):
                          bad.append(f"{path}:{node.lineno}")
          if bad:
              sys.exit("Home Assistant reached from a standalone module: " + ", ".join(bad))
          print("engine and its standalone tests are Home Assistant free")
          PY
      - name: Run the engine tests standalone
        run: pytest $ENGINE_TESTS -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
