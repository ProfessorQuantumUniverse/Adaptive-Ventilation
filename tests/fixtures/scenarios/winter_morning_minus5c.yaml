name: winter_morning_minus5c
description: >
  Winter morning at -5 C. A short wide-open purge is due, and because the
  bedroom and the living room are connected with windows on opposite facades
  the engine recognises the cross draught and shortens the duration.

now: "2025-01-20T07:30:00+01:00"
mode: auto
presence: true

building:
  type: old_renovated
  floor: 1

outdoor:
  temperature: -5.0
  humidity: 85
  wind_speed: 1.5
  wind_bearing: 90
  cloud_coverage: 60
  pressure: 1022

sun:
  elevation: -4
  azimuth: 115

forecast:
  start: "2025-01-20T07:30:00+01:00"
  humidity: 85
  temperatures:
    [-5, -4, -2, 0, 1, 2, 2, 1, -1, -3, -4, -5,
     -6, -6, -6, -5.5, -5, -4.5, -4, -3, -1, 0, 1, 2,
     2, 1, -1, -3, -4, -5]

rooms:
  - id: bedroom
    name: Bedroom
    temperature: 19.0
    humidity: 55
    co2: 900
    volume: 40
    priority: 1
    bedroom: true
    heating: true
    connected: [living_room]
  - id: living_room
    name: Living room
    temperature: 21.0
    humidity: 45
    co2: 700
    volume: 60
    priority: 2
    heating: true
    connected: [bedroom]

windows:
