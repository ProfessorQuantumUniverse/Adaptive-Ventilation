    name: Bedroom east
    room: bedroom
    azimuth: 95
    area: 1.4
  - id: living_west
    name: Living room west
    room: living_room
    azimuth: 265
    area: 1.8

memory:
  last_purge:
    bedroom: "2025-01-19T21:30:00+01:00"
    living_room: "2025-01-19T21:30:00+01:00"

expect:
  global_state: air_quality
  rules_present: [winter_purge_schedule]
  rules_absent: [dry_air, night_flush]
  actions:
    bedroom_east: [cross_ventilate]
    living_west: [cross_ventilate]
  max_duration:
    winter_purge_schedule: 8
