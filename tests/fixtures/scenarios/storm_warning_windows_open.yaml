name: storm_warning_windows_open
description: >
  Perfect night flush conditions - and a severe storm warning. SAFETY wins,
  every window closes, and the push goes out even inside the quiet hours.

now: "2025-06-28T22:30:00+02:00"
mode: auto
presence: true

building:
  type: old_renovated
  floor: 2

outdoor:
  temperature: 19.0
  humidity: 70
  wind_speed: 18.0
  wind_bearing: 250
  cloud_coverage: 95
  pressure: 998

sun:
  elevation: -8
  azimuth: 315

alerts:
  - event: Severe thunderstorm with hail
    kind: hail
    severity: severe
    start: "2025-06-28T21:00:00+02:00"
    end: "2025-06-29T02:00:00+02:00"

forecast:
  start: "2025-06-28T22:30:00+02:00"
  humidity: 75
  temperatures:
    [19, 18, 17, 16, 16, 16, 17, 19, 22, 24, 26, 27,
     28, 28, 27, 26, 25, 23, 21, 20, 19, 18, 17, 17,
     17, 17, 18, 20, 22, 24]

rooms:
  - id: living_room
    name: Living room
    temperature: 26.0
    humidity: 50
    volume: 60
    priority: 1

windows:
  - id: living_south
    name: Living room south
    room: living_room
    open: true
    open_since: "2025-06-28T21:00:00+02:00"
    azimuth: 200
    area: 2.4
    cover: cover.living_south
    cover_position: 100

expect:
  global_state: storm
  rules_present: [storm_warning]
  rules_absent: [night_flush]
  actions:
    living_south: [close]
    "living_south:cover": [cover_down]
  notify_rules: [storm_warning]
